<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Mike RS cybersecurity profile banner</title>
  <desc id="desc">A navy and teal banner reading Michael Solomon, Cybersecurity Operations, Cloud Security, and GRC.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081426"/>
      <stop offset="0.55" stop-color="#102946"/>
      <stop offset="1" stop-color="#0b3b4a"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#65e6d4"/>
      <stop offset="1" stop-color="#4ba3ff"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="22" fill="url(#background)"/>

  <g opacity="0.16" stroke="#79d8e7" stroke-width="2">
    <path d="M820 56 L930 116 L1050 62 L1135 132" fill="none"/>
    <path d="M792 220 L920 170 L1030 228 L1150 178" fill="none"/>
    <path d="M930 116 L920 170 M1050 62 L1030 228 M1135 132 L1150 178" fill="none"/>
  </g>
  <g fill="#6ee7df">
    <circle cx="820" cy="56" r="5"/>
    <circle cx="930" cy="116" r="6"/>
    <circle cx="1050" cy="62" r="5"/>
    <circle cx="1135" cy="132" r="6"/>
    <circle cx="792" cy="220" r="5"/>
    <circle cx="920" cy="170" r="6"/>
    <circle cx="1030" cy="228" r="5"/>
    <circle cx="1150" cy="178" r="5"/>
  </g>

  <circle cx="1050" cy="160" r="112" fill="#56d6cf" opacity="0.08" filter="url(#softGlow)"/>
  <path d="M1000 91 L1065 116 V164 C1065 209 1038 241 1000 258 C962 241 935 209 935 164 V116 Z" fill="none" stroke="url(#shield)" stroke-width="8"/>
  <path d="M968 164 L990 186 L1032 141" fill="none" stroke="#d4fff9" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="72" y="65" width="74" height="7" rx="3.5" fill="#66e5d4"/>
  <text x="72" y="136" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="55" font-weight="700" letter-spacing="0.5">Michael Solomon</text>
  <text x="75" y="184" fill="#b9cce1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="500">IT &amp; Information Security Professional</text>
  <text x="75" y="233" fill="#75e4d8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="600">SECURITY OPERATIONS  ·  CLOUD SECURITY  ·  GRC</text>
  <text x="75" y="273" fill="#89a4bd" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">Connecting technical evidence, risk decisions, and resilient outcomes</text>
</svg>

